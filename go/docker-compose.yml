# Pilot Finance v2.0 - Go + HTMX
#
# Prérequis avant `docker compose up --build` :
#   1) créer un fichier .env à côté de ce fichier :
#        AUTH_SECRET=$(openssl rand -hex 32)
#        ENCRYPTION_KEY=$(openssl rand -hex 32)
#        BLIND_INDEX_KEY=$(openssl rand -hex 32)
#      (sans ces trois clés le serveur refuse de démarrer, par conception)
#   2) préparer le volume de données pour l'uid non privilégié :
#        mkdir -p data && sudo chown -R 65532:65532 data

services:
  pilot:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: pilot-go
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 64M
    # Le conteneur tourne en uid/gid 65532 (non privilégié) : le dossier de
    # données doit lui appartenir avant le premier démarrage.
    #   mkdir -p data && sudo chown -R 65532:65532 data
    user: "65532:65532"
    environment:
      # ENV=production active les logs JSON ET impose TRUSTED_PROXIES
      # (sans quoi X-Forwarded-For serait spoofable et contournerait le rate limit).
      - ENV=production
      # Liste d'IPs / CIDR autorisés à poser X-Forwarded-For. Par défaut : les
      # réseaux bridge Docker (le reverse-proxy est un conteneur voisin).
      # À restreindre à l'IP exacte du reverse-proxy quand elle est fixe.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12}
      - TZ=Europe/Paris
      - PORT=3000
      - DATABASE_URL=file:/data/pilot.db
      - AUTH_SECRET=${AUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - BLIND_INDEX_KEY=${BLIND_INDEX_KEY}
      # Configuration SMTP (optionnel)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # SMTP_SECURE=true → TLS implicite (port 465). Sinon STARTTLS (port 587).
      - SMTP_SECURE=${SMTP_SECURE:-false}
      # Configuration domaine
      - HOST=${HOST:-localhost}
      - ALLOW_REGISTER=${ALLOW_REGISTER:-false}
      # DISABLE_RATE_LIMIT=true DÉSACTIVE toutes les limites de débit.
      # Réservé aux tests E2E — ne jamais activer sur une instance exposée.
      # - DISABLE_RATE_LIMIT=false
      # --- Docker Secrets (alternative plus sécurisée) ---
      # Décommenter les lignes _FILE et commenter les variables ci-dessus :
      # - AUTH_SECRET_FILE=/run/secrets/auth_secret
      # - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      # - BLIND_INDEX_KEY_FILE=/run/secrets/blind_index_key
      # - DATABASE_URL_FILE=/run/secrets/database_url
      # - SMTP_PASS_FILE=/run/secrets/smtp_pass
    # secrets:
    #   - auth_secret
    #   - encryption_key
    #   - blind_index_key
    #   - database_url
    #   - smtp_pass
    volumes:
      - ./data:/data
    ports:
      - "3000:3000"
    healthcheck:
      # Le premier élément DOIT être CMD / CMD-SHELL / NONE (spec Compose) :
      # sans lui, la sonde est ignorée ET celle de l'image est écrasée.
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

