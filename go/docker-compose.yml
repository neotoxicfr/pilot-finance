# Pilot Finance v2.0 - Go + HTMX
# Pour tester: docker compose up --build

services:
  pilot:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: pilot-go
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    environment:
      - ENV=production
      - TZ=Europe/Paris
      - PORT=3000
      - DATABASE_URL=file:/data/pilot.db
      - AUTH_SECRET=${AUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - BLIND_INDEX_KEY=${BLIND_INDEX_KEY}
      # Configuration SMTP (optionnel)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Configuration domaine
      - HOST=${HOST:-localhost}
      - ALLOW_REGISTER=${ALLOW_REGISTER:-false}
      # --- Docker Secrets (alternative plus sécurisée) ---
      # Décommenter les lignes _FILE et commenter les variables ci-dessus :
      # - AUTH_SECRET_FILE=/run/secrets/auth_secret
      # - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      # - BLIND_INDEX_KEY_FILE=/run/secrets/blind_index_key
      # - DATABASE_URL_FILE=/run/secrets/database_url
      # - SMTP_PASS_FILE=/run/secrets/smtp_pass
    # secrets:
    #   - auth_secret
    #   - encryption_key
    #   - blind_index_key
    #   - database_url
    #   - smtp_pass
    volumes:
      - ./data:/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

