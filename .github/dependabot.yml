version: 2

# Montées de version vers dev, chaque jour ; mineures et correctifs groupés
# par écosystème (une PR), majeures à part. Tout ce qui passe la CI fusionne
# seul dans dev (automerge.yml). Les mises à jour de sécurité visent
# toujours main : automerge.yml les ramène sur dev. La CI décide seule.
# Aucun délai : `cooldown: exclude: ["*"]` coupe les 3 jours de délai par défaut de Dependabot.
updates:
  - package-ecosystem: "gomod"
    directory: "/go"
    target-branch: "dev"
    schedule:
      interval: "daily"
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      go:
        update-types: ["minor", "patch"]
    # modernc.org/sqlite exige EXACTEMENT la libc de son propre go.mod : libc ne
    # bouge qu'avec sqlite (garde-fou : TestLibcMatchesSQLite).
    ignore:
      - dependency-name: "modernc.org/libc"

  - package-ecosystem: "docker"
    directory: "/go"
    target-branch: "dev"
    schedule:
      interval: "daily"
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/e2e"
    target-branch: "dev"
    schedule:
      interval: "daily"
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      e2e:
        update-types: ["minor", "patch"]

  # Chaîne d'assets du stage `css` de go/Dockerfile (Tailwind, esbuild).
  - package-ecosystem: "npm"
    directory: "/go"
    target-branch: "dev"
    schedule:
      interval: "daily"
    cooldown:
      exclude: ["*"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      assets:
        update-types: ["minor", "patch"]
