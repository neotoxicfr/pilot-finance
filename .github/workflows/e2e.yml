name: E2E Tests

on:
  push:
    branches: [develop]
    paths-ignore: ['**.md', 'LICENSE', '.github/dependabot.yml']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**.md', 'LICENSE', '.github/dependabot.yml']

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build server
        working-directory: go
        run: go build -o ../server ./cmd/server

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Generate test keys
        run: |
          AUTH=$(openssl rand -hex 32)
          ENC=$(openssl rand -hex 32)
          BLIND=$(openssl rand -hex 32)
          echo "::add-mask::$AUTH"
          echo "::add-mask::$ENC"
          echo "::add-mask::$BLIND"
          echo "AUTH_SECRET=$AUTH" >> $GITHUB_ENV
          echo "ENCRYPTION_KEY=$ENC" >> $GITHUB_ENV
          echo "BLIND_INDEX_KEY=$BLIND" >> $GITHUB_ENV

      - name: Start server
        run: |
          cd go && DISABLE_RATE_LIMIT=true \
            ALLOW_REGISTER=true \
            AUTH_SECRET=${{ env.AUTH_SECRET }} \
            ENCRYPTION_KEY=${{ env.ENCRYPTION_KEY }} \
            BLIND_INDEX_KEY=${{ env.BLIND_INDEX_KEY }} \
            ../server &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          curl -sf http://localhost:3000/api/health || exit 1

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7
