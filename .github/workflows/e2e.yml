name: E2E Tests

on:
  push:
    branches: [develop]
    paths-ignore: ['**.md', 'LICENSE', '.github/dependabot.yml']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**.md', 'LICENSE', '.github/dependabot.yml']

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build server
        working-directory: go
        run: go build -o ../server ./cmd/server

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Generate test keys
        id: keys
        run: |
          echo "auth=$(openssl rand -hex 32)" >> $GITHUB_OUTPUT
          echo "enc=$(openssl rand -hex 32)" >> $GITHUB_OUTPUT
          echo "blind=$(openssl rand -hex 32)" >> $GITHUB_OUTPUT

      - name: Start server
        run: |
          cd go && DISABLE_RATE_LIMIT=true \
            ALLOW_REGISTER=true \
            AUTH_SECRET=${{ steps.keys.outputs.auth }} \
            ENCRYPTION_KEY=${{ steps.keys.outputs.enc }} \
            BLIND_INDEX_KEY=${{ steps.keys.outputs.blind }} \
            ../server &
          sleep 3
          curl -sf http://localhost:3000/api/health || exit 1

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7
