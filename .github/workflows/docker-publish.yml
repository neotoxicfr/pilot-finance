name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/**'
      - '!.github/workflows/docker-publish.yml'
      - '.github/dependabot.yml'
      - 'e2e/**'
      - '.lighthouserc.json'
      - 'Makefile'
      - '.gitignore'
    tags: [ 'v*.*.*' ]

# Deux pushes rapprochés sur develop laissaient l'ancien commit sous :dev
# (audit S-38). On annule le run obsolète — jamais sur un tag, dont la
# publication ne doit pas être interrompue.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Barrière de test (audit S-13) : l'image :dev est tirée telle quelle en
  # production, ce job doit donc réussir AVANT toute publication. Il tourne sur
  # les branches ET sur les tags — `needs: [test]` sans `always()` garantit
  # qu'aucun `push: true` n'a lieu si un test échoue.
  test:
    name: Test barrier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Run tests
        working-directory: go
        run: go test -race -timeout 600s ./...

  build:
    name: Build and push
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "value=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}

      # Le scan doit précéder le push (audit S-35) : scanner l'image déjà
      # publiée ne peut plus rien empêcher. Build amd64 local, mis en cache et
      # réutilisé par l'étape de publication ci-dessous.
      - name: Build image locally for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./go
          push: false
          load: true
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: pilot-finance:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Périmètre réel de ce scan, explicitement : l'étage final est `scratch`,
      # il n'a donc AUCUN paquet OS, et le binaire Go est compressé par UPX, ce
      # qui empêche l'analyseur `gobinary` de lire debug/buildinfo. Ce scan ne
      # détecte donc que ce qui est ajouté à l'image hors binaire (assets,
      # certificats). La couverture réelle des dépendances Go est assurée par
      # `trivy fs` (bloquant) et `govulncheck` dans ci.yml. Il est conservé
      # bloquant et pré-push pour qu'une régression de base d'image future
      # (passage hors scratch) soit arrêtée avant publication.
      - name: Scan image with Trivy (blocking, pre-push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: pilot-finance:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./go
          push: true
          platforms: ${{ startsWith(github.ref, 'refs/tags/') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
