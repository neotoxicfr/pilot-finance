name: Lighthouse CI

on:
  push:
    branches: [develop]
    paths-ignore: ['**.md', 'LICENSE', '.github/dependabot.yml']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**.md', 'LICENSE', '.github/dependabot.yml']

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build server
        working-directory: go
        run: go build -o ../server ./cmd/server

      - name: Generate test keys
        run: |
          AUTH=$(openssl rand -hex 32)
          ENC=$(openssl rand -hex 32)
          BLIND=$(openssl rand -hex 32)
          echo "::add-mask::$AUTH"
          echo "::add-mask::$ENC"
          echo "::add-mask::$BLIND"
          echo "AUTH_SECRET=$AUTH" >> $GITHUB_ENV
          echo "ENCRYPTION_KEY=$ENC" >> $GITHUB_ENV
          echo "BLIND_INDEX_KEY=$BLIND" >> $GITHUB_ENV

      - name: Start server
        run: |
          cd go && DISABLE_RATE_LIMIT=true \
            ALLOW_REGISTER=true \
            AUTH_SECRET=${{ env.AUTH_SECRET }} \
            ENCRYPTION_KEY=${{ env.ENCRYPTION_KEY }} \
            BLIND_INDEX_KEY=${{ env.BLIND_INDEX_KEY }} \
            ../server &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login > /dev/null && break
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:3000/login > /dev/null || { echo "::error::Server failed to start"; exit 1; }

      - name: Lighthouse audit (login page)
        id: lighthouse
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            http://localhost:3000/login
          runs: 3
          uploadArtifacts: true
          configPath: .lighthouserc.json

      - name: Check scores
        if: always()
        run: |
          echo "## Lighthouse Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f .lighthouseci/manifest.json ]; then
            echo "::warning::Lighthouse did not produce results (NO_FCP — flaky Chrome headless)"
            echo "No reports generated — Chrome headless rendering failed." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "| Category | Score |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY

          # Parse best report (highest performance score)
          MANIFEST=$(cat .lighthouseci/manifest.json)
          BEST_REPORT=""
          BEST_PERF=0
          for REPORT in $(echo "$MANIFEST" | jq -r '.[].jsonPath'); do
            if [ -f "$REPORT" ]; then
              P=$(jq '.categories.performance.score // 0' "$REPORT")
              if [ "$(echo "$P > $BEST_PERF" | bc)" -eq 1 ]; then
                BEST_PERF=$P
                BEST_REPORT=$REPORT
              fi
            fi
          done

          if [ -n "$BEST_REPORT" ]; then
            PERF=$(jq '.categories.performance.score * 100' "$BEST_REPORT")
            A11Y=$(jq '.categories.accessibility.score * 100' "$BEST_REPORT")
            BP=$(jq '.categories["best-practices"].score * 100' "$BEST_REPORT")
            SEO=$(jq '.categories.seo.score * 100' "$BEST_REPORT")

            echo "| Performance | ${PERF}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Accessibility | ${A11Y}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Best Practices | ${BP}% |" >> $GITHUB_STEP_SUMMARY
            echo "| SEO | ${SEO}% |" >> $GITHUB_STEP_SUMMARY

            # Fail if performance < 80
            if [ "$(echo "$PERF < 80" | bc)" -eq 1 ]; then
              echo "::error::Performance score ${PERF}% is below 80% threshold"
              exit 1
            fi
          else
            echo "::warning::Could not find valid Lighthouse report"
          fi
