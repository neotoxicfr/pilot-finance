name: Lighthouse CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build server
        working-directory: go
        run: go build -o ../server ./cmd/server

      - name: Generate test keys
        id: keys
        run: |
          echo "auth=$(openssl rand -hex 32)" >> $GITHUB_OUTPUT
          echo "enc=$(openssl rand -hex 32)" >> $GITHUB_OUTPUT
          echo "blind=$(openssl rand -hex 32)" >> $GITHUB_OUTPUT

      - name: Start server
        run: |
          cd go && DISABLE_RATE_LIMIT=true \
            ALLOW_REGISTER=true \
            AUTH_SECRET=${{ steps.keys.outputs.auth }} \
            ENCRYPTION_KEY=${{ steps.keys.outputs.enc }} \
            BLIND_INDEX_KEY=${{ steps.keys.outputs.blind }} \
            ../server &
          for i in $(seq 1 10); do
            sleep 2
            curl -sf http://localhost:3000/login > /dev/null && break
          done

      - name: Lighthouse audit (login page)
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/login
          runs: 1
          uploadArtifacts: true
          configPath: .lighthouserc.json

      - name: Check scores
        run: |
          echo "## Lighthouse Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Score |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY

          # Parse report
          MANIFEST=$(cat .lighthouseci/manifest.json)
          REPORT=$(echo "$MANIFEST" | jq -r '.[0].jsonPath')

          if [ -f "$REPORT" ]; then
            PERF=$(jq '.categories.performance.score * 100' "$REPORT")
            A11Y=$(jq '.categories.accessibility.score * 100' "$REPORT")
            BP=$(jq '.categories["best-practices"].score * 100' "$REPORT")
            SEO=$(jq '.categories.seo.score * 100' "$REPORT")

            echo "| Performance | ${PERF}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Accessibility | ${A11Y}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Best Practices | ${BP}% |" >> $GITHUB_STEP_SUMMARY
            echo "| SEO | ${SEO}% |" >> $GITHUB_STEP_SUMMARY

            # Fail if performance < 80
            if [ "$(echo "$PERF < 80" | bc)" -eq 1 ]; then
              echo "::error::Performance score ${PERF}% is below 80% threshold"
              exit 1
            fi
          else
            echo "::warning::Could not find Lighthouse report"
          fi
