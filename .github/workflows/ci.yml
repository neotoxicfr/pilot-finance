name: CI

on:
  push:
    branches: [develop]
    paths-ignore: ['**.md', 'LICENSE', '.github/dependabot.yml']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**.md', 'LICENSE', '.github/dependabot.yml']

jobs:
  test:
    name: go test -race
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Run tests with race detector
        working-directory: go
        run: go test -race -timeout 600s -coverprofile=coverage.out $(go list ./... | grep -v -E '/cmd/|/db$')

      - name: Enforce coverage threshold
        working-directory: go
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 100.0" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 100% threshold"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: go/coverage.out

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: go

      - name: Vulnerability scan
        working-directory: go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  security-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: './go'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
