name: CI

on:
  push:
    branches: [develop]
    # Les tags sont couverts pour que :latest passe par le même garde-fou que
    # develop (lint, couverture, govulncheck, Trivy fs) — audit S-13.
    tags: ['v*.*.*']
    paths-ignore: ['**.md', 'LICENSE', '.github/dependabot.yml']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**.md', 'LICENSE', '.github/dependabot.yml']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  test:
    name: go test -race
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Run tests with race detector
        working-directory: go
        run: go test -race -timeout 600s -coverprofile=coverage.out $(go list ./... | grep -v -E '/cmd/|/db$')

      # /cmd/ et /db sont exclus du seuil de couverture mais leurs tests doivent
      # tourner à chaque push — sinon une régression db (ex. FK appliquées par le
      # bump modernc/sqlite 1.54) n'apparaît qu'au build Docker du tag de release.
      - name: Run cmd and db tests (no coverage requirement)
        working-directory: go
        run: go test -race -timeout 600s ./cmd/... ./internal/db

      - name: Enforce coverage threshold
        working-directory: go
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 100.0" | bc -l)" -eq 1 ]; then
            # Surface the exact under-covered functions so failures are actionable.
            go tool cover -func=coverage.out | awk '$1 != "total:" && $3 != "100.0%" {print "::warning::UNCOVERED "$1" "$2" "$3}'
            echo "::error::Coverage ${COVERAGE}% is below 100% threshold"
            exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: go/coverage.out

      # Version explicite (audit S-38) : `latest` rendait la CI capable de
      # rougir sans changement de code, juste avant un déploiement. À bumper à
      # la main — Dependabot ne met pas à jour les `with:` d'une action.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: go

      - name: Vulnerability scan
        working-directory: go
        run: |
          # v1.1.4 embarquait golang.org/x/tools@v0.29.0, qui ne sait pas
          # analyser du Go 1.27 : govulncheck paniquait dans le constructeur SSA
          # et sortait en code 2 (plantage de l'outil, pas une vulnérabilité).
          # Toute future montée de Go doit s'accompagner d'une montée d'ici.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  security-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './go'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # Audit FIN-5 : la chaîne d'assets (Tailwind + esbuild) est le seul chemin par
  # lequel du code tiers atteint les fichiers servis en production. Ce job
  # rejoue exactement le stage `css` de go/Dockerfile : `npm ci` échoue si le
  # lockfile manque ou diverge de package.json, et la compilation valide que
  # l'outillage épinglé produit bien les assets — sans attendre le build Docker.
  assets:
    name: Asset toolchain (Tailwind + esbuild)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: go/package-lock.json

      - name: Install pinned toolchain (no install scripts)
        working-directory: go
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build assets
        working-directory: go
        run: |
          out=$(mktemp -d)
          ./node_modules/.bin/tailwindcss -i static/css/input.css -o "$out/tailwind.css" --minify
          ./node_modules/.bin/esbuild static/css/app.css  --minify --outfile="$out/app.css"
          ./node_modules/.bin/esbuild static/js/charts.js  --minify --outfile="$out/charts.js"
          ./node_modules/.bin/esbuild static/js/passkey.js --minify --outfile="$out/passkey.js"
          ls -l "$out"
