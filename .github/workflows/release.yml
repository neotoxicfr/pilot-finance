name: Release

on:
  push:
    tags:
      - 'v*'

# Pas de `concurrency` ici : une publication de release ne doit jamais être
# annulée par un autre run.

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # Suite complète (audit S-13) : l'exclusion de /cmd/ et /db permettait à
      # une régression db de créer la release GitHub alors que le build d'image,
      # lui, testait tout — release et image pouvaient diverger silencieusement.
      - run: go test -race -timeout 600s ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          make_latest: true
